server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  main:
    banner-mode: "off"
  application:
    name: medivault-security-backend
  datasource:
    url: jdbc:h2:mem:medivaultdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  h2:
    console:
      enabled: false

medivault:
  security:
    jwt:
      secret: 'v9y$B&E)H@McQfTjWnZr4u7x!A%D*GKaPdSgUkXp2s5v8y/B?E(H+MbQeThWmYq'
      expiration-ms: 3600000
